name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # The test of the pi extension loads its TypeScript with Node.js, which
      # strips the types from version 22.18 on.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: python3 plugins/ai-slop/scripts/tests/run_smoke.py
